name: Barya Stories auto-post

# Posts EP13-EP440 to the Barya Stories Facebook Page, 5x/day Manila.
# Runs on GitHub's servers, NOT on Muse, so no approval card ever appears.
#
# WHY every 15 minutes instead of 5 exact times:
# GitHub's scheduler is best-effort — on 2026-11-26 it simply never fired
# the 2pm (06:00 UTC) tick, so EP15 was 54 minutes late and needed a manual
# run. poster.py now has a due-check: it only posts when the next episode's
# Manila publish time has arrived, and exits quietly otherwise. So this
# workflow polls every 15 minutes and the first tick at or after a slot
# posts that episode: worst case ~15 min late, never early, never twice,
# and a failed post is retried at the next tick because state.json only
# advances on a successful post.
# Slots stay 08:00, 11:00, 14:00, 18:00, 21:00 Asia/Manila.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode number to post (leave empty for next in state.json)'
        required: false
        type: string
      dry_run:
        description: 'Dry run only (download + build cover, do not post)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and Python deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q google-api-python-client google-auth
      - name: Post next episode
        env:
          BARYA_PAGE_TOKEN: ${{ secrets.BARYA_PAGE_TOKEN }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: |
          if [ -n "${{ inputs.episode }}" ]; then
            EP_FLAG="--episode ${{ inputs.episode }}"
          else
            EP_FLAG=""
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          else
            DRY=""
          fi
          python3 poster.py $EP_FLAG $DRY
      - name: Save updated state
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "barya-poster"
          git config user.email "barya-poster@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Posted EP from state.json [skip ci]"
          git push
